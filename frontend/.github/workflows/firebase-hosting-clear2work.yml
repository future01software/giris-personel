name: Deploy Frontend to Firebase Hosting (clear2work-484405)

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          echo "REACT_APP_BACKEND_URL=https://clear2work-backend-477134913566.europe-west1.run.app" > .env
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLEAR2WORK_484405 }}"
          projectId: clear2work-484405
          entryPoint: frontend